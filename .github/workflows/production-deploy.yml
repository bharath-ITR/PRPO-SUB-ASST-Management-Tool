name: Production Deploy (Manual Approval)

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Type Approve to move the change form Quality to Production"
        required: true

jobs:
  approval:
    name: Wait for Manual Approval
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.approve == 'Approve' }}
    outputs:
      approved: ${{ steps.set-output.outputs.approved }}
    steps:
      - name: Check approval
        id: set-output
        run: echo "approved=true" >> $GITHUB_OUTPUT

  build:
    name: Build Fullstack App
    runs-on: ubuntu-latest
    needs: approval
    if: ${{ needs.approval.outputs.approved == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install and build frontend
        run: |
          cd client
          npm install
          CI=false REACT_APP_API=${{ secrets.PRPOPRODUCTIONURL }} npm run build

      
      - name: Upload fullstack app
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: |
            client/build
            Controllers
            Middleware
            Models
            POTemplate
            Routes
            Token
            package.json
            package-lock.json
            server.js
            Database.js

  deploy:
    name: Deploy to Azure Production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download fullstack app
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app

      - name: Install backend dependencies
        run: npm install


      - name: Deploy app to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: PR-PO-PORTAL-ITRADIANT
          slot-name: 'Production'
          publish-profile: ${{ secrets.PRPOPRODUCTION }}
          package: .
